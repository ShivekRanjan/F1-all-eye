<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- F1SE mark — the folded-flag chevron the app's own <Logo/> draws, so the
       tab icon and the sidebar finally agree. Previously three bars, which read
       as a pause button and dissolved into a smudge at 16px.

       Gold is hard-coded here on purpose. In-app the chevron's gradient ends in
       rgb(var(--accent)) so it follows the runtime theme; a favicon cannot, and
       an accent-dependent mark is exactly how the social card sat cyan for weeks
       after the rebrand. Static assets pin to the brand default. -->
  <rect width="64" height="64" rx="14" fill="#151109"/>
  <rect width="64" height="64" rx="14" fill="none" stroke="#3a3020" stroke-width="2"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d780"/>
      <stop offset="1" stop-color="#d4af37"/>
    </linearGradient>
  </defs>
  <!-- polygon(0 0, 100% 25%, 100% 100%, 0 75%) from App.tsx, inset into the badge -->
  <polygon points="20,16 44,22 44,48 20,42" fill="url(#g)"/>
</svg>
